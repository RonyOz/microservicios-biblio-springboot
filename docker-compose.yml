services:
  rabbitmq:
    image: rabbitmq:3.13-management
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  kafka:
    image: confluentinc/cp-kafka:latest
    network_mode: host
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    network_mode: host
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-biblioteca.json:/opt/keycloak/data/import/realm-biblioteca.json

  usuarios:
    build: ./microservicio-usuarios
    network_mode: host
    depends_on:
      - keycloak

  catalogo:
    build: ./microservicio-catalogo
    network_mode: host
    depends_on:
      - keycloak

  circulacion:
    build: ./microservicio-circulacion
    network_mode: host
    depends_on:
      - keycloak
      - catalogo
      - notificacion

  notificacion:
    build: ./microservicio-notificacion
    network_mode: host
    depends_on:
      - keycloak