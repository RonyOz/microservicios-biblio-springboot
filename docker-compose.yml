services:
  rabbitmq:
    image: rabbitmq:3.13-management
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    network_mode: host
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    network_mode: host
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: localhost:2181
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    network_mode: host
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-biblioteca.json:/opt/keycloak/data/import/realm-biblioteca.json

  usuarios:
    build: ./microservicio-usuarios
    network_mode: host
    depends_on:
      - keycloak

  catalogo:
    build: ./microservicio-catalogo
    network_mode: host
    depends_on:
      - keycloak

  circulacion:
    build: ./microservicio-circulacion
    network_mode: host
    depends_on:
      - keycloak
      - catalogo
      - notificacion

  notificacion:
    build: ./microservicio-notificacion
    network_mode: host
    depends_on:
      - keycloak