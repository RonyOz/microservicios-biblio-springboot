spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:circulaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8083
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/biblioteca}
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/biblioteca/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:circulacion}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:circulacion-secret}