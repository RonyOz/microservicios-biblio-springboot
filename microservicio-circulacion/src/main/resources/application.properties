spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:circulaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8083
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/biblioteca}
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080/realms/biblioteca}
springdoc.swagger-ui.oauth.client-id=biblioteca-app
springdoc.swagger-ui.oauth.realm=biblioteca
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/biblioteca/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:circulacion}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:circulacion-secret}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer